<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Quick Question</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%230f172a'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='Georgia'>1</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f9fc;
    --ink:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
    --sky:#8ccdf5;
    --sky-deep:#2b8ccf;
    --sky-soft:#e8f4fc;
    --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:Inter,system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }

  /* soft background shapes */
  .blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
  .blob.a{width:520px;height:520px;background:#cfe7f9;top:-160px;left:-160px;opacity:.8}
  .blob.b{width:460px;height:460px;background:#e4edf5;bottom:-180px;right:-120px;opacity:.9}
  .grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(ellipse at center,#000 10%,transparent 70%);
    -webkit-mask-image:radial-gradient(ellipse at center,#000 10%,transparent 70%);
  }

  main{
    position:relative;z-index:1;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.7);
    margin-bottom:28px;
  }
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--sky-deep);display:block}
  h1{
    font-family:Inter,system-ui,sans-serif;font-weight:700;
    font-size:clamp(38px,6.5vw,76px);line-height:1.06;letter-spacing:-.035em;max-width:13ch;
  }
  h1 em{
    font-style:normal;color:var(--sky-deep);
    background:var(--sky-soft);border-radius:.18em;padding:0 .18em;
  }
  .sub{margin-top:20px;color:var(--muted);font-size:16px}

  .buttons{margin-top:46px;display:flex;gap:14px;align-items:center;justify-content:center;min-height:70px}
  .btn{
    font:inherit;font-weight:500;font-size:16px;border-radius:999px;padding:15px 38px;
    border:1px solid transparent;cursor:pointer;white-space:nowrap;
  }
  .btn-yes{
    background:var(--ink);color:#fff;
    box-shadow:0 10px 28px rgba(15,23,42,.18);
    scale:var(--s,1);
    transition:scale .35s cubic-bezier(.2,.8,.2,1),box-shadow .2s,transform .2s;
  }
  .btn-yes:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(15,23,42,.26)}
  .btn-no{
    background:#fff;color:var(--ink);border-color:var(--line);
    box-shadow:0 4px 14px rgba(15,23,42,.05);
    transition:left .32s cubic-bezier(.2,.8,.2,1),top .32s cubic-bezier(.2,.8,.2,1);
  }
  .btn-no.fleeing{position:fixed;z-index:5;margin:0}
  .spacer{display:inline-block}

  .counter{
    position:fixed;left:50%;bottom:26px;translate:-50% 0;z-index:2;
    font-size:13px;color:var(--muted);opacity:0;transition:opacity .4s;
  }
  .counter.show{opacity:1}
  .counter b{color:var(--ink);font-weight:600}

  /* toast */
  .toast{
    position:fixed;right:24px;bottom:24px;z-index:20;width:330px;max-width:calc(100vw - 32px);
    background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:left;
    box-shadow:0 24px 60px rgba(15,23,42,.14);
    opacity:0;transform:translateY(18px);pointer-events:none;
    transition:opacity .4s,transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .toast.show{opacity:1;transform:none;pointer-events:auto}
  .toast .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sky-deep);font-weight:600}
  .toast h3{font-size:17px;font-weight:600;margin:8px 0 4px;line-height:1.3}
  .toast p{font-size:14px;color:var(--muted);line-height:1.5}
  .toast .row{display:flex;gap:8px;margin-top:16px}
  .btn-sm{font:inherit;font-size:14px;font-weight:500;border-radius:999px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .btn-sm.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
  .toast .x{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}

  /* modal */
  .overlay{
    position:fixed;inset:0;z-index:30;padding:16px;
    background:rgba(15,23,42,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .overlay.open{opacity:1;pointer-events:auto}
  .modal{
    position:relative;background:var(--card);border-radius:26px;width:min(560px,100%);
    max-height:calc(100vh - 32px);overflow:auto;padding:30px;text-align:left;
    box-shadow:0 40px 100px rgba(15,23,42,.25);
    transform:translateY(18px) scale(.98);transition:transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .overlay.open .modal{transform:none}
  .modal .close{
    position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;
    border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;color:var(--muted);
  }
  .modal .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sky-deep);font-weight:600}
  .modal h2{font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(26px,4vw,32px);line-height:1.15;letter-spacing:-.025em;margin:8px 40px 8px 0}
  .modal .lead{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:20px}

  .slider{position:relative;border-radius:18px;overflow:hidden;background:var(--sky-soft);aspect-ratio:4/3;touch-action:pan-y}
  .track{display:flex;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
  .slide{flex:0 0 100%;height:100%}
  .slide img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
  .ph{
    width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    color:var(--sky-deep);font-size:13px;text-align:center;padding:20px;
    background:repeating-linear-gradient(135deg,var(--sky-soft) 0 14px,#f1f8fd 14px 28px);
  }
  .ph svg{opacity:.7}
  .ph code{background:#fff;border:1px solid #d6e9f7;padding:3px 8px;border-radius:6px;color:var(--ink);font-size:12px}
  .arrow{
    position:absolute;top:50%;translate:0 -50%;width:40px;height:40px;border-radius:50%;
    border:0;background:rgba(255,255,255,.92);color:var(--ink);cursor:pointer;font-size:20px;
    box-shadow:0 6px 18px rgba(15,23,42,.12);transition:opacity .2s;
  }
  .arrow.prev{left:12px}.arrow.next{right:12px}
  .arrow[disabled]{opacity:0;pointer-events:none}
  .caption{margin-top:16px;font-size:16px;line-height:1.5;min-height:48px}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:12px}
  .dots{display:flex;gap:6px;align-items:center}
  .dot{width:7px;height:7px;border-radius:4px;border:0;padding:0;background:var(--line);cursor:pointer;transition:width .3s,background .3s}
  .dot.active{width:22px;background:var(--ink)}
  .num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .modal .cta{margin-top:22px;width:100%;padding:14px;font-size:15px}

  canvas#confetti{position:fixed;inset:0;z-index:40;pointer-events:none}

  @media (max-width:520px){
    .modal{padding:22px}
    .toast{right:16px;bottom:16px}
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="blob a"></div>
  <div class="blob b"></div>

  <main>
    <span class="eyebrow"><i></i><span id="eyebrow"></span></span>
    <h1 id="question"></h1>
    <p class="sub" id="sub"></p>
    <div class="buttons" id="buttons">
      <button class="btn btn-yes" id="yes"></button>
      <button class="btn btn-no" id="no" tabindex="-1"></button>
    </div>
  </main>

  <div class="counter" id="counter"></div>

  <!-- help toast -->
  <div class="toast" id="toast" role="dialog" aria-live="polite">
    <button class="x" id="toastClose" aria-label="Close">×</button>
    <span class="tag" id="toastTag"></span>
    <h3 id="toastTitle"></h3>
    <p id="toastText"></p>
    <div class="row">
      <button class="btn-sm dark" id="toastYes"></button>
      <button class="btn-sm" id="toastNo"></button>
    </div>
  </div>

  <!-- thanks modal -->
  <div class="overlay" id="thanks">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="close" data-close aria-label="Close">×</button>
      <span class="tag" id="thanksTag"></span>
      <h2 id="thanksTitle"></h2>
      <p class="lead" id="thanksLead"></p>
      <div data-slider="thanks"></div>
    </div>
  </div>

  <!-- help modal -->
  <div class="overlay" id="help">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="close" data-close aria-label="Close">×</button>
      <span class="tag" id="helpTag"></span>
      <h2 id="helpTitle"></h2>
      <p class="lead" id="helpLead"></p>
      <div data-slider="help"></div>
      <button class="btn btn-yes cta" id="helpYes"></button>
    </div>
  </div>

  <canvas id="confetti"></canvas>

<script>
/* =========================================================
   EDIT EVERYTHING HERE (texts + images)
   Images go into the "images" folder. File names must match exactly.
   The ORDER of the slides below = the order they appear on the site.
   ========================================================= */
const CONFIG = {
  teacher: "Sumon Chaudhuri",
  eyebrow: "Gen AI Applications · One quick question",
  question: "Will you give me a <em>1</em>?",
  sub: "Please choose wisely.",
  yes: "Yes",
  noLabels: ["No", "Sure?", "Really?", "Catch me", "No chance", "Nice try", "Give up", "Only Yes works"],
  helpDelay: 5000,      // ms until the help pop-up appears
  helpRepeat: 9000,     // if dismissed: ms until it comes back

  toast: {
    tag: "Decision support",
    title: "Need some helpful arguments?",
    text: "I have a few that might make your decision a lot easier.",
    yes: "Yes, please",
    no: "Later"
  },

  thanks: {
    tag: "Decision saved",
    title: "Thank you, dear {name}!",
    lead: "I knew you would make the right choice.",
    slides: [
      { src: "images/thanks-1.png", text: "Me, after seeing your answer." },
      { src: "images/thanks-2.png", text: "My family when I told them." },
      { src: "images/thanks-3.png", text: "Forever grateful." }
    ]
  },

  help: {
    tag: "Helpful arguments",
    title: "A few good reasons",
    lead: "Click through. The decision gets much easier afterwards.",
    cta: "Convinced. Yes!",
    slides: [
      { src: "images/argument-1.jpg", text: "It would make me really, really happy." },
      { src: "images/argument-2.jpg", text: "This website is 100% vibe-coded with LLMs. Exactly as required." },
      { src: "images/argument-3.jpg", text: "The No button clearly doesn't work. Technically, Yes is the only option." }
    ]
  },

  doneTitle: "Deal. <em>1</em>.",
  doneSub: "Thank you for a great course.",
  againLabel: "See it again",
  counter: "No button escaped <b>{n}×</b>",
  placeholder: "Add image here"
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const nameFill = s => s.replace("{name}", CONFIG.teacher);

// --- fill texts
$("eyebrow").textContent = CONFIG.eyebrow;
$("question").innerHTML = CONFIG.question;
$("sub").textContent = CONFIG.sub;
$("yes").textContent = CONFIG.yes;
$("no").textContent = CONFIG.noLabels[0];
$("toastTag").textContent = CONFIG.toast.tag;
$("toastTitle").textContent = CONFIG.toast.title;
$("toastText").textContent = CONFIG.toast.text;
$("toastYes").textContent = CONFIG.toast.yes;
$("toastNo").textContent = CONFIG.toast.no;
$("thanksTag").textContent = CONFIG.thanks.tag;
$("thanksTitle").textContent = nameFill(CONFIG.thanks.title);
$("thanksLead").textContent = CONFIG.thanks.lead;
$("helpTag").textContent = CONFIG.help.tag;
$("helpTitle").textContent = CONFIG.help.title;
$("helpLead").textContent = CONFIG.help.lead;
$("helpYes").textContent = CONFIG.help.cta;

let answered = false;

/* ---------------- Fleeing "Nein" button ---------------- */
const no = $("no"), yes = $("yes");
let flees = 0, lastFlee = 0, spacer = null;

function moveNo(px, py) {
  const now = performance.now();
  if (answered || now - lastFlee < 120) return;
  lastFlee = now;

  // first escape: lift button out of the layout, keep a spacer in its place
  if (!no.classList.contains("fleeing")) {
    const r0 = no.getBoundingClientRect();
    spacer = document.createElement("span");
    spacer.className = "spacer";
    spacer.style.width = r0.width + "px";
    no.after(spacer);
    no.style.left = r0.left + "px";
    no.style.top = r0.top + "px";
    no.classList.add("fleeing");
    no.offsetWidth; // force reflow so the jump animates
  }

  flees++;
  no.textContent = CONFIG.noLabels[Math.min(flees, CONFIG.noLabels.length - 1)];
  yes.style.setProperty("--s", Math.min(1 + flees * 0.05, 1.5).toFixed(2));

  const r = no.getBoundingClientRect();
  const w = r.width, h = r.height, m = 20;
  let x, y, best = null, bestD = -1;
  for (let i = 0; i < 40; i++) {
    x = m + Math.random() * Math.max(1, innerWidth - w - 2 * m);
    y = m + Math.random() * Math.max(1, innerHeight - h - 2 * m);
    const d = Math.hypot(x + w / 2 - px, y + h / 2 - py);
    const yr = yes.getBoundingClientRect();
    const overlapsYes = x < yr.right + 10 && x + w > yr.left - 10 && y < yr.bottom + 10 && y + h > yr.top - 10;
    if (!overlapsYes && d > 260) { best = [x, y]; break; }
    if (!overlapsYes && d > bestD) { bestD = d; best = [x, y]; }
  }
  if (best) { no.style.left = best[0] + "px"; no.style.top = best[1] + "px"; }

  const c = $("counter");
  c.innerHTML = CONFIG.counter.replace("{n}", flees);
  c.classList.add("show");
}

function distToRect(px, py, r) {
  const dx = Math.max(r.left - px, 0, px - r.right);
  const dy = Math.max(r.top - py, 0, py - r.bottom);
  return Math.hypot(dx, dy);
}

document.addEventListener("pointermove", e => {
  if (answered) return;
  if (distToRect(e.clientX, e.clientY, no.getBoundingClientRect()) < 70) moveNo(e.clientX, e.clientY);
});
no.addEventListener("pointerenter", e => moveNo(e.clientX, e.clientY));
no.addEventListener("touchstart", e => { e.preventDefault(); const t = e.touches[0]; moveNo(t.clientX, t.clientY); }, { passive: false });
no.addEventListener("click", e => { e.preventDefault(); moveNo(e.clientX, e.clientY); });
no.addEventListener("focus", () => no.blur());
addEventListener("resize", () => {
  if (!no.classList.contains("fleeing")) return;
  const r = no.getBoundingClientRect();
  no.style.left = Math.min(r.left, innerWidth - r.width - 20) + "px";
  no.style.top = Math.min(r.top, innerHeight - r.height - 20) + "px";
});

/* ---------------- Slider ---------------- */
function makeSlider(root, slides) {
  root.innerHTML = `
    <div class="slider">
      <div class="track"></div>
      <button class="arrow prev" aria-label="Previous">‹</button>
      <button class="arrow next" aria-label="Next">›</button>
    </div>
    <p class="caption"></p>
    <div class="foot"><div class="dots"></div><span class="num"></span></div>`;
  const track = root.querySelector(".track"), cap = root.querySelector(".caption");
  const dots = root.querySelector(".dots"), num = root.querySelector(".num");
  const prev = root.querySelector(".prev"), next = root.querySelector(".next");
  let i = 0;

  slides.forEach((s, k) => {
    const slide = document.createElement("div");
    slide.className = "slide";
    const img = new Image();
    img.alt = s.text;
    img.onerror = () => {
      slide.innerHTML = `<div class="ph">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/></svg>
        ${CONFIG.placeholder}<code>${s.src}</code></div>`;
    };
    img.src = s.src;
    slide.appendChild(img);
    track.appendChild(slide);
    const d = document.createElement("button");
    d.className = "dot"; d.setAttribute("aria-label", "Image " + (k + 1));
    d.onclick = () => go(k);
    dots.appendChild(d);
  });

  function go(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    track.style.transform = `translateX(${-i * 100}%)`;
    cap.textContent = slides[i].text;
    num.textContent = `${i + 1} / ${slides.length}`;
    [...dots.children].forEach((d, k) => d.classList.toggle("active", k === i));
    prev.disabled = i === 0;
    next.disabled = i === slides.length - 1;
  }
  prev.onclick = () => go(i - 1);
  next.onclick = () => go(i + 1);

  // swipe
  let sx = null;
  const sl = root.querySelector(".slider");
  sl.addEventListener("pointerdown", e => { sx = e.clientX; });
  sl.addEventListener("pointerup", e => {
    if (sx === null) return;
    const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1));
  });

  go(0);
  return { go, step: d => go(i + d) };
}

const sliders = {
  thanks: makeSlider(document.querySelector('[data-slider="thanks"]'), CONFIG.thanks.slides),
  help: makeSlider(document.querySelector('[data-slider="help"]'), CONFIG.help.slides)
};

/* ---------------- Modals ---------------- */
let openId = null;
function openModal(id) {
  if (openId) $(openId).classList.remove("open");
  sliders[id].go(0);
  $(id).classList.add("open");
  openId = id;
}
function closeModal() {
  if (!openId) return;
  $(openId).classList.remove("open");
  openId = null;
}
document.querySelectorAll(".overlay").forEach(o => {
  o.addEventListener("click", e => { if (e.target === o || e.target.hasAttribute("data-close")) closeModal(); });
});
document.addEventListener("keydown", e => {
  if (!openId) return;
  if (e.key === "Escape") closeModal();
  if (e.key === "ArrowRight") sliders[openId].step(1);
  if (e.key === "ArrowLeft") sliders[openId].step(-1);
});

/* ---------------- Help toast ---------------- */
let helpTimer = setTimeout(showToast, CONFIG.helpDelay);
function showToast() { if (!answered && !openId) $("toast").classList.add("show"); else if (!answered) helpTimer = setTimeout(showToast, 3000); }
function hideToast(again) {
  $("toast").classList.remove("show");
  clearTimeout(helpTimer);
  if (again && !answered) helpTimer = setTimeout(showToast, CONFIG.helpRepeat);
}
$("toastYes").onclick = () => { hideToast(false); openModal("help"); };
$("toastNo").onclick = () => hideToast(true);
$("toastClose").onclick = () => hideToast(true);

/* ---------------- YES ---------------- */
function sayYes() {
  if (answered) { openModal("thanks"); return; }
  answered = true;
  hideToast(false);
  no.remove(); if (spacer) spacer.remove();
  $("counter").classList.remove("show");
  yes.style.setProperty("--s", 1);
  openModal("thanks");
  confetti();
  setTimeout(() => {
    $("question").innerHTML = CONFIG.doneTitle;
    $("sub").textContent = CONFIG.doneSub;
    yes.textContent = CONFIG.againLabel;
  }, 400);
}
yes.onclick = sayYes;
$("helpYes").onclick = sayYes;

/* ---------------- Confetti ---------------- */
function confetti() {
  const cv = $("confetti"), ctx = cv.getContext("2d");
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const colors = ["#8ccdf5", "#2b8ccf", "#0f172a", "#cbd5e1", "#ffffff"];
  const parts = Array.from({ length: 160 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 120,
    y: innerHeight * .45,
    vx: (Math.random() - .5) * 16,
    vy: -Math.random() * 15 - 5,
    w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
    c: colors[Math.floor(Math.random() * colors.length)]
  }));
  const start = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = .5;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      if (p.c === "#ffffff") ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (t - start < 3500) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(start);
}
</script>
</body>
</html>
